<script>
  const quotes = [
    "You did a good job helping us through a time when we were at our worst",
    "Je wilt een einde aan het conflict in plaats van steeds opnieuw naar de rechter",
    "We hebben nu waterdichte afspraken. Niemand kan hier meer om heen",
    "Eindelijk hebben we eens echt gepraat over de zaken waar het werkelijk over gaat",
    "Ik snap nu waarom zij zo star aan hun standpunten bleven vasthouden",
    "In dit wespennest was iemand nodig die afstand kon houden",
    "Ik twijfelde of het wel zou lukken, maar deze oplossing had ik nooit kunnen bedenken",
    "Maatschap, scheiding, ontslag of erfenis: het gaat altijd om botsende individuen",
    "Dit gesprek hadden we echt nodig. U denkt tenminste in oplossingen in plaats van in problemen"
  ];
  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const picked = shuffle(quotes).slice(0, 4);
  for(let i = 0; i < 4; i++){
    document.querySelector(`#quote-${i+1} p`).textContent = `\u2018${picked[i]}\u2019`;
  }
</script>
